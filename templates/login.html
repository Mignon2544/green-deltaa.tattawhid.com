<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Admin Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: Arial, sans-serif; background: #f4f6f8; margin: 0; padding: 30px; display: flex; justify-content: center; align-items: center; height: 80vh; }
    .card { width: 100%; max-width: 400px; background: white; padding: 28px; border-radius: 10px; box-shadow: 0 4px 18px rgba(0,0,0,.08); }
    h1 { margin-top: 0; font-size: 24px; text-align: center; color: #333; }
    label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 14px; margin-top: 15px; }
    input { width: 100%; padding: 10px; border: 1px solid #ccd2d8; border-radius: 6px; box-sizing: border-box; }
    button { margin-top: 22px; width: 100%; padding: 13px; border: 0; border-radius: 6px; background: #0b7a4b; color: white; font-size: 16px; font-weight: 700; cursor: pointer; }
    button:hover { background: #08643d; }
    .error { color: red; font-size: 14px; text-align: center; margin-bottom: 10px; }

    /* MOBILE FIX */
    @media (max-width: 768px) {
      body { padding: 15px; height: auto; padding-top: 50px; }
      .card { padding: 20px; }
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Admin Login</h1>
    
    {% if error %}
      <div class="error">{{ error }}</div>
    {% endif %}

    <form method="POST" action="/login">
      <div>
        <label for="username">Username</label>
        <input id="username" name="username" type="text" required autofocus>
      </div>
      <div>
        <label for="password">Password</label>
        <input id="password" name="password" type="password" required>
      </div>
      <button type="submit">Login</button>
    </form>
  </div>
</body>
</html>
