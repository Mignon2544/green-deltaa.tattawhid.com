<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Generated PDFs</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: Arial, sans-serif; background: #f4f6f8; margin: 0; padding: 30px; }
    .card { max-width: 1000px; margin: auto; background: white; padding: 28px; border-radius: 10px; box-shadow: 0 4px 18px rgba(0,0,0,.08); position: relative; }
    
    .header-container { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid #eee; padding-bottom: 15px; flex-wrap: wrap; gap: 10px; }
    h1 { margin: 0; font-size: 24px; color: #333; }
    .nav-btns { display: flex; gap: 10px; }
    .nav-btn { background: #0b7a4b; color: white; text-decoration: none; padding: 8px 16px; border-radius: 6px; font-size: 14px; font-weight: bold; }
    .nav-btn:hover { background: #08643d; }
    .logout-btn { background: #d9534f; color: white; text-decoration: none; padding: 8px 16px; border-radius: 6px; font-size: 14px; font-weight: bold; }
    .logout-btn:hover { background: #c9302c; }

    .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; background: #f9f9f9; padding: 15px; border-radius: 8px; border: 1px solid #ddd; }
    .delete-btn { background: #d9534f; color: white; border: none; padding: 10px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; }
    .delete-btn:hover { background: #c9302c; }

    .file-list { display: flex; flex-direction: column; gap: 15px; }
    .file-item { display: flex; align-items: center; gap: 15px; background: white; border: 1px solid #eee; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,.02); }
    .file-item:hover { border-color: #ccc; }
    
    .checkbox-wrapper input { width: 20px; height: 20px; cursor: pointer; }
    .thumb { width: 40px; height: 56px; background: #ddd; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 10px; color: #666; flex-shrink: 0; }
    .file-info { flex-grow: 1; min-width: 0; }
    .file-name { font-weight: bold; color: #333; font-size: 16px; word-break: break-all; }
    .file-meta { font-size: 12px; color: #777; margin-top: 4px; }
    
    .actions { display: flex; gap: 8px; flex-shrink: 0; }
    .action-btn { padding: 8px 12px; border-radius: 6px; border: 1px solid #ddd; background: white; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 14px; text-decoration: none; color: #333; }
    .action-btn:hover { background: #f0f0f0; }
    .btn-view { background: #0b7a4b; color: white; border-color: #0b7a4b; }
    .btn-view:hover { background: #08643d; }
    .btn-share { background: #007bff; color: white; border-color: #007bff; }
    .btn-share:hover { background: #0056b3; }
    .btn-delete-single { background: #ffebeb; color: #d9534f; border-color: #f5c6cb; }
    .btn-delete-single:hover { background: #f5c6cb; }

    @media (max-width: 600px) {
      body { padding: 15px; }
      .card { padding: 15px; }
      .header-container { flex-direction: column; align-items: flex-start; }
      .toolbar { flex-direction: column; gap: 10px; align-items: stretch; }
      .file-item { flex-wrap: wrap; }
      .file-info { width: 100%; order: 3; margin-top: 10px; }
      .actions { width: 100%; order: 4; justify-content: space-between; margin-top: 10px; }
      .action-btn { flex-grow: 1; }
    }
  </style>
</head>
<body>
  <div class="card">
    
    <div class="header-container">
      <h1>📁 Generated PDFs</h1>
      <div class="nav-btns">
        <a href="/" class="nav-btn">+ Generate New</a>
        <a href="/logout" class="logout-btn">Logout</a>
      </div>
    </div>

    <form method="POST" action="/delete-file" id="bulk-form">
      <div class="toolbar">
        <div style="font-weight: bold; color: #555;">
          Total Files: {{ files|length }}
        </div>
        <button type="submit" class="delete-btn" onclick="return confirm('Are you sure you want to delete the selected files?');">
          Delete Selected
        </button>
      </div>

      <div class="file-list">
        {% for file in files %}
        <div class="file-item">
          
          <div class="checkbox-wrapper">
            <input type="checkbox" name="selected_files" value="{{ file.rel_path }}">
          </div>

          <div class="thumb">PDF</div>

          <div class="file-info">
            <div class="file-name">{{ file.name }}</div>
            <div class="file-meta">{{ file.size }} KB • {{ file.date }}</div>
          </div>

          <div class="actions">
            <!-- THIS IS THE UPDATED LINK -->
            <a href="https://green-deltainsurance.com/{{ file.rel_path }}" target="_blank" class="action-btn btn-view" title="View PDF">
              👁️ View
            </a>
            
            <!-- Share button with updated link logic -->
            <button type="button" class="action-btn btn-share" onclick="copyLink(this)" data-link="https://green-deltainsurance.com/{{ file.rel_path }}" title="Copy Share Link">
              🔗 Share
            </button>

            <button type="submit" name="selected_files" value="{{ file.rel_path }}" class="action-btn btn-delete-single" onclick="return confirm('Delete this specific file?');" title="Delete">
              🗑️
            </button>
          </div>

        </div>
        {% else %}
        <div style="text-align: center; padding: 40px; color: #777; border: 2px dashed #ddd; border-radius: 8px;">
          No PDFs generated yet.
        </div>
        {% endfor %}
      </div>
    </form>

  </div>

  <script>
    function copyLink(btn) {
      const link = btn.getAttribute('data-link');
      navigator.clipboard.writeText(link).then(() => {
        const originalText = btn.innerHTML;
        btn.innerHTML = '✅ Copied!';
        btn.style.background = '#28a745';
        btn.style.borderColor = '#28a745';
        btn.style.color = 'white';
        setTimeout(() => {
          btn.innerHTML = originalText;
          btn.style.background = '#007bff';
          btn.style.borderColor = '#007bff';
        }, 2000);
      });
    }
  </script>
</body>
</html>
