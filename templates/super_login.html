<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>System Access</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: Arial, sans-serif; background: #1a202c; margin: 0; padding: 30px; display: flex; justify-content: center; align-items: center; height: 80vh; color: white; }
    .card { width: 100%; max-width: 400px; background: #2d3748; padding: 28px; border-radius: 10px; box-shadow: 0 4px 18px rgba(0,0,0,.5); }
    h1 { margin-top: 0; font-size: 22px; text-align: center; color: #e2e8f0; }
    label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 14px; margin-top: 15px; color: #cbd5e0; }
    input { width: 100%; padding: 12px; border: 1px solid #4a5568; background: #1a202c; color: white; border-radius: 6px; box-sizing: border-box; font-size: 16px; text-align: center; letter-spacing: 2px; }
    button { margin-top: 22px; width: 100%; padding: 13px; border: 0; border-radius: 6px; background: #e53e3e; color: white; font-size: 16px; font-weight: 700; cursor: pointer; }
    button:hover { background: #c53030; }
    .forgot-btn { background: none; border: none; color: #a0aec0; text-decoration: underline; cursor: pointer; margin-top: 15px; width: 100%; text-align: center; font-size: 13px; }
    .forgot-btn:hover { color: white; }
    .error { color: #fc8181; font-size: 14px; text-align: center; margin-bottom: 10px; }
    .success { color: #68d391; font-size: 14px; text-align: center; margin-bottom: 10px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🔒 System Access</h1>
    
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    {% if message %}<div class="success">{{ message }}</div>{% endif %}

    <form method="POST" action="/super-admin">
      <label for="key">Enter 16-Digit Key</label>
      <input id="key" name="key" type="text" placeholder="XXXX-XXXX-XXXX-XXXX" required autofocus pattern="[A-Z0-9]{4}-[A-Z0-9]{4}-[A-Z0-9]{4}-[A-Z0-9]{4}">
      <button type="submit">Unlock</button>
    </form>

    <form method="POST" action="/super-admin/forgot">
      <button type="submit" class="forgot-btn">Forgot Key? Send to Registered Email</button>
    </form>
  </div>
</body>
</html>
